name: resolve
on:
  pull_request:
    paths:
      - "collections/**"
      - "aggregators/**"
      - "lib/**"
      - "schemas/**"
      - "scripts/**"
      - ".github/resolve.ts"
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "aggregators/**"
      - "lib/**"
      - "schemas/**"
      - "scripts/**"
      - ".github/resolve.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/resolve.ts
