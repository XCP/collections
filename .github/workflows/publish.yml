name: publish

on:
  push:
    branches: [main]
    paths:
      - "collections/**"
      - "aggregators/**"
      - "lib/**"
      - "schemas/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate repository
        run: node .github/validate.ts
      - name: Check source coverage
        run: node .github/check-source-coverage.ts
      - name: Run adapter tests
        run: node .github/run-tests.ts
      - name: Download published baseline
        run: curl --fail --silent --show-error --max-time 60 --max-filesize 25000000 https://xcp.github.io/collections/collections.json --output "$RUNNER_TEMP/published.json"
      - name: Measure and export marketplace manifest
        run: node scripts/measure-sources.ts --baseline "$RUNNER_TEMP/published.json"
      - name: Upload source measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-measurement
          path: dist/source-measurement.json
          retention-days: 30
          if-no-files-found: warn
      - name: Create Pages archive
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" collections.json
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
