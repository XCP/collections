name: validate
on:
  pull_request:
  push:
    branches: [main]

# Pull requests execute repository code (including contributed adapters), so
# this workflow intentionally uses the pull_request event, a read-only token,
# no repository secrets, and no persisted checkout credential. Never convert
# it to pull_request_target.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject runtime dependencies
        run: >-
          node -e "const p=require('./package.json');
          const deps={...p.dependencies,...p.devDependencies,...p.optionalDependencies};
          if(Object.keys(deps).length){console.error('Adapters must use Node.js built-ins and repository helpers; dependencies are not allowed.');process.exit(1)}"
      - name: Validate collection metadata
        run: node .github/validate.ts
      - name: Check collection and aggregator adapter coverage
        run: node .github/check-source-coverage.ts
      - name: Run fixture-backed adapter tests
        run: node .github/run-tests.ts
